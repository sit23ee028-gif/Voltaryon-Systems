<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Sewage Monitoring System</title>
  
  <!-- Include Leaflet.js for the map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <!-- Include Chart.js for data visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* General Layout */
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f7f9;
    }
    
    .container {
      margin: 20px;
    }

    h1 {
      text-align: center;
      color: #4CAF50;
    }

    /* Dashboard Styles */
    .dashboard {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
    }

    .dashboard .card {
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      flex-basis: 45%;
      text-align: center;
    }

    .dashboard .card h3 {
      color: #4CAF50;
    }

    .card ul {
      list-style-type: none;
      padding: 0;
      color: #555;
    }

    .card ul li {
      font-size: 18px;
      margin: 10px 0;
    }

    /* Alert styles */
    .alert {
      margin: 20px 0;
      padding: 15px;
      border-radius: 5px;
      color: #fff;
      font-weight: bold;
    }

    .alert-high {
      background-color: #f44336; /* Red */
    }

    .alert-medium {
      background-color: #ff9800; /* Orange */
    }

    .alert-low {
      background-color: #4CAF50; /* Green */
    }

    /* Chart styles */
    .chart-container {
      width: 100%;
      height: 400px;
    }

    /* Map Styles */
    #map {
      height: 400px;
      width: 100%;
      margin-bottom: 20px;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>Smart Sewage Monitoring System</h1>

    <!-- Real-Time Dashboard -->
    <div class="dashboard">
      <!-- Card for Water Level -->
      <div class="card">
        <h3>Water Level</h3>
        <ul>
          <li id="waterLevel">Loading...</li>
        </ul>
      </div>

      <!-- Card for pH Level -->
      <div class="card">
        <h3>pH Level</h3>
        <ul>
          <li id="phLevel">Loading...</li>
        </ul>
      </div>

      <!-- Card for Flow Rate -->
      <div class="card">
        <h3>Flow Rate</h3>
        <ul>
          <li id="flowRate">Loading...</li>
        </ul>
      </div>

      <!-- Card for Turbidity -->
      <div class="card">
        <h3>Turbidity</h3>
        <ul>
          <li id="turbidity">Loading...</li>
        </ul>
      </div>
    </div>

    <!-- Alerts Section -->
    <div id="alerts"></div>

    <!-- Historical Data Chart -->
    <div class="chart-container">
      <canvas id="historicalChart"></canvas>
    </div>

    <!-- Interactive Map -->
    <h2>Interactive Map</h2>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    // Simulate real-time sensor data updates
    function updateRealTimeData() {
      const waterLevel = Math.random() * 100;
      const phLevel = 6 + Math.random();
      const flowRate = Math.random() * 10;
      const turbidity = Math.random() * 10;

      // Update real-time data on dashboard
      document.getElementById('waterLevel').textContent = waterLevel.toFixed(2) + ' cm';
      document.getElementById('phLevel').textContent = phLevel.toFixed(2);
      document.getElementById('flowRate').textContent = flowRate.toFixed(2) + ' m³/h';
      document.getElementById('turbidity').textContent = turbidity.toFixed(2) + ' NTU';

      // Simulate an alert based on water level
      const alertContainer = document.getElementById('alerts');
      if (waterLevel > 80) {
        alertContainer.innerHTML = `<div class="alert alert-high">High Water Level! Potential Overflow Detected.</div>`;
      } else if (waterLevel > 50) {
        alertContainer.innerHTML = `<div class="alert alert-medium">Warning: Elevated Water Level.</div>`;
      } else {
        alertContainer.innerHTML = `<div class="alert alert-low">System Normal.</div>`;
      }
    }

    // Simulate historical data for chart
    const historicalData = [];
    function updateHistoricalData() {
      const time = new Date().toLocaleTimeString();
      const waterLevel = Math.random() * 100;

      historicalData.push({ time: time, waterLevel: waterLevel });

      // Remove oldest data to keep chart limited to last 10 data points
      if (historicalData.length > 10) {
        historicalData.shift();
      }

      // Update Chart
      chart.update();
    }

    // Set up Chart.js for Historical Data
    const ctx = document.getElementById('historicalChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: historicalData.map(data => data.time),
        datasets: [{
          label: 'Water Level (cm)',
          data: historicalData.map(data => data.waterLevel),
          borderColor: 'rgba(75, 192, 192, 1)',
          borderWidth: 1,
          fill: false
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: {
            type: 'category',
            title: { display: true, text: 'Time' }
          },
          y: {
            title: { display: true, text: 'Water Level (cm)' }
          }
        }
      }
    });

    // Initialize Leaflet Map for Sewage System Sensors
    function initMap() {
      const map = L.map('map').setView([40.7128, -74.0060], 13);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

      const markers = [
        { lat: 40.7128, lon: -74.0060, status: 'Normal' },
        { lat: 40.7306, lon: -73.9352, status: 'Alert' }
      ];

      markers.forEach(sensor => {
        L.marker([sensor.lat, sensor.lon])
          .addTo(map)
          .bindPopup(`<b>Sensor Location:</b> (${sensor.lat}, ${sensor.lon})<br>Status: ${sensor.status}`);
      });
    }

    // Call functions
    setInterval(updateRealTimeData, 5000);  // Update every 5 seconds
    setInterval(updateHistoricalData, 10000);  // Update chart every 10 seconds

    initMap();
  </script>
</body>
</html>
